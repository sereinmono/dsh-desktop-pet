<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>desktop-pet</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #pet { display: block; }
  #menu {
    position: fixed;
    display: none;
    z-index: 10;
    min-width: 120px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    font: 13px/1.4 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #222;
    user-select: none;
  }
  #menu button {
    display: block;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  #menu button:hover { background: rgba(0, 0, 0, 0.07); }

  /* Status bubbles area (top of the window, above the pet). */
  #bubbles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-top: 6px;
    box-sizing: border-box;
    user-select: none;
    font: 12px/1.7 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .bubble {
    max-width: calc(100% - 16px);
    min-width: 60px;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(0, 0, 0, 0.10);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    color: #222;
    overflow: hidden;
  }
  .bubble-title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bubble-thinking {
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #collapse-btn {
    position: fixed;
    top: 4px;
    right: 6px;
    z-index: 7;
    display: none;
    pointer-events: auto;
    width: 22px;
    height: 22px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.96);
    color: #555;
    font: 12px/1 system-ui, sans-serif;
    cursor: pointer;
  }
  #badge {
    position: fixed;
    top: 4px;
    right: 6px;
    z-index: 7;
    display: none;
    pointer-events: auto;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 11px;
    background: #7c5cff;
    color: #fff;
    font: 12px/22px system-ui, sans-serif;
    text-align: center;
    cursor: pointer;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<canvas id="pet"></canvas>
<div id="bubbles"></div>
<button id="collapse-btn" type="button" aria-label="Collapse">–</button>
<div id="badge" role="button" aria-label="Show tasks">0</div>
<div id="menu"><button id="menu-close">Close pet</button></div>

<script src="neutralino.js"></script>
<script src="pet-render.js"></script>
<script>
(() => {
  const canvas = document.getElementById('pet')
  const ctx = canvas.getContext('2d')
  const menu = document.getElementById('menu')
  const menuClose = document.getElementById('menu-close')
  const bubblesEl = document.getElementById('bubbles')
  const collapseBtn = document.getElementById('collapse-btn')
  const badge = document.getElementById('badge')

  const atlas = new Image()
  let atlasReady = false

  // Window identity + geometry, provided by the host in `pet.init`.
  let nlWinId = null
  let layout = layoutForScale(1)
  let cssLayout = cssLayoutFor(layout, window.devicePixelRatio)
  let spriteUrl = null
  let hoverState = false
  let dragging = false
  let dragStart = null
  let moveSeq = 0
  let collapsed = false
  let tasks = []

  function applyCanvasSize() {
    // The window is created in physical pixels; CSS pixels = physical / dpr.
    // Keep the canvas buffer at the physical size (fills the window exactly,
    // crispest), and scale only the CSS size down.
    const css = cssSizeFor(layout, window.devicePixelRatio)
    cssLayout = cssLayoutFor(layout, window.devicePixelRatio)
    canvas.width = layout.width
    canvas.height = layout.height
    canvas.style.width = css.width + 'px'
    canvas.style.height = css.height + 'px'
    bubblesEl.style.height = cssLayout.topPad + 'px'
    ctx.imageSmoothingEnabled = false
  }

  function drawCurrent() {
    if (!atlasReady) return
    const r = sourceRect(currentDirective)
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    ctx.drawImage(atlas, r.sx, r.sy, r.sw, r.sh, layout.petX, layout.petY, layout.petW, layout.petH)
  }

  let currentDirective = { pose: 'idle', frameIndex: 0, sx: 0, sy: 0 }

  atlas.addEventListener('load', () => {
    atlasReady = true
    drawCurrent()
    Neutralino.events.broadcast('pet.uiReady', { atlasWidth: atlas.naturalWidth, atlasHeight: atlas.naturalHeight })
  })
  atlas.addEventListener('error', () => {
    Neutralino.events.broadcast('pet.uiError', { message: 'spritesheet failed to load: ' + spriteUrl })
  })

  function hideMenu() { menu.style.display = 'none' }

  // --- Host -> UI directives -------------------------------------------------

  // Announce readiness immediately; the client library queues broadcasts until
  // its WebSocket connects, and the host may also poll via `pet.handshakeQuery`.
  function announceReady() {
    Neutralino.events.broadcast('pet.frontendReady', { t: Date.now() })
  }
  Neutralino.events.on('pet.handshakeQuery', announceReady)
  announceReady()

  Neutralino.events.on('pet.init', (evt) => {
    const d = evt.detail || {}
    nlWinId = d.windowId ?? null
    if (Number.isFinite(d.scale)) layout = layoutForScale(d.scale)
    applyCanvasSize()
    if (d.spritesheetUrl && d.spritesheetUrl !== spriteUrl) {
      spriteUrl = d.spritesheetUrl
      atlasReady = false
      atlas.src = spriteUrl
    }
    // Position is set by the host after creation; mirror it for drag math.
    if (Number.isFinite(d.x) && Number.isFinite(d.y)) winPos = { x: d.x, y: d.y }
  })

  Neutralino.events.on('pet.frame', (evt) => {
    currentDirective = evt.detail || currentDirective
    drawCurrent()
  })

  Neutralino.events.on('pet.atlas', (evt) => {
    const d = evt.detail || {}
    if (d.spritesheetUrl && d.spritesheetUrl !== spriteUrl) {
      spriteUrl = d.spritesheetUrl
      atlasReady = false
      atlas.src = spriteUrl
    }
  })

  // --- Status bubbles --------------------------------------------------------

  function renderBubbles() {
    bubblesEl.textContent = ''
    for (const task of tasks) {
      const bubble = document.createElement('div')
      bubble.className = 'bubble'
      const title = document.createElement('div')
      title.className = 'bubble-title'
      title.textContent = task.title || task.taskId
      bubble.appendChild(title)
      if (task.thinking) {
        const thinking = document.createElement('div')
        thinking.className = 'bubble-thinking'
        thinking.textContent = task.thinking
        bubble.appendChild(thinking)
      }
      bubblesEl.appendChild(bubble)
    }
    badge.textContent = String(tasks.length)
    updateBubbleVisibility()
  }

  function updateBubbleVisibility() {
    const hasTasks = tasks.length > 0
    bubblesEl.style.display = !collapsed && hasTasks ? 'flex' : 'none'
    collapseBtn.style.display = !collapsed && hasTasks && hoverState ? 'block' : 'none'
    badge.style.display = collapsed && hasTasks ? 'block' : 'none'
  }

  collapseBtn.addEventListener('click', () => {
    collapsed = true
    updateBubbleVisibility()
  })
  badge.addEventListener('click', () => {
    collapsed = false
    updateBubbleVisibility()
  })

  Neutralino.events.on('pet.tasks', (evt) => {
    tasks = Array.isArray(evt.detail) ? evt.detail : []
    renderBubbles()
  })

  // --- Pointer interaction ---------------------------------------------------

  let winPos = { x: 0, y: 0 }

  function setHover(state) {
    if (hoverState === state) return
    hoverState = state
    Neutralino.events.broadcast(state ? 'pet.hover' : 'pet.unhover', { t: Date.now() })
    updateBubbleVisibility()
  }

  canvas.addEventListener('pointerenter', () => setHover(true))
  canvas.addEventListener('pointerleave', () => {
    setHover(false)
    if (dragging) endDrag(true)
  })
  bubblesEl.addEventListener('pointerenter', () => setHover(true))
  bubblesEl.addEventListener('pointerleave', () => setHover(false))

  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return
    hideMenu()
    dragging = true
    dragStart = { px: e.screenX, py: e.screenY, wx: winPos.x, wy: winPos.y, moved: false }
    canvas.setPointerCapture(e.pointerId)
  })

  canvas.addEventListener('pointermove', (e) => {
    if (!dragging || !dragStart) return
    // Pointer deltas are logical CSS pixels; window.move takes physical
    // pixels, so scale by devicePixelRatio (verified on 150% DPI displays).
    const dpr = window.devicePixelRatio || 1
    const dx = (e.screenX - dragStart.px) * dpr
    const dy = (e.screenY - dragStart.py) * dpr
    if (!dragStart.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return
    dragStart.moved = true

    const target = clampDragTarget(dragStart.wx + dx, dragStart.wy + dy, layout, screen.width * dpr, screen.height * dpr)
    winPos = target
    const seq = ++moveSeq
    // Fire-and-forget; only the newest move matters.
    Neutralino.window.move(target.x, target.y).catch(() => {})
    const dir = dx < 0 ? 'left' : 'right'
    Neutralino.events.broadcast('pet.dragMove', { direction: dir, seq })
  })

  function endDrag(cancelled) {
    if (!dragging) return
    dragging = false
    const moved = dragStart?.moved ?? false
    dragStart = null
    moveSeq = 0
    if (cancelled) return
    Neutralino.events.broadcast('pet.dragEnd', {})
    if (moved) {
      Neutralino.events.broadcast('pet.drag', { x: winPos.x, y: winPos.y })
    } else {
      // A press that never moved is a click: ask the host to open the WebUI.
      Neutralino.events.broadcast('pet.openWebui', {})
    }
  }

  canvas.addEventListener('pointerup', (e) => {
    if (e.button !== 0) return
    endDrag(false)
  })

  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault()
    menu.style.left = Math.min(e.clientX, Math.max(0, layout.width - 130)) + 'px'
    menu.style.top = Math.min(e.clientY, Math.max(0, layout.height - 40)) + 'px'
    menu.style.display = 'block'
  })
  document.addEventListener('pointerdown', (e) => {
    if (!menu.contains(e.target)) hideMenu()
  })
  menuClose.addEventListener('click', () => {
    hideMenu()
    Neutralino.events.broadcast('pet.close', {})
  })

  // Window focus tracking (kept minimal; the host decides semantics).
  Neutralino.events.on('windowFocus', () => setHover(true))
  Neutralino.events.on('windowBlur', () => setHover(false))

  applyCanvasSize()
  Neutralino.init().catch(() => {})
})()
</script>
</body>
</html>
